<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#ffffff">
<title>Ghayesh & Aparna – Wedding Invitation</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Jost:wght@300;400&family=Noto+Serif+Devanagari:wght@500&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#ffffff;--card:#ffffff;--ink:#3a2a2a;--soft:#8a7060;--gold:#b8863b;--line:#e8d6bd;--shade:rgba(40,20,10,.55);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:#fff url("assets/background.jpg") center/cover fixed no-repeat;color:var(--ink);font-family:Jost,system-ui,sans-serif;font-weight:300;text-align:center}
.wrap{max-width:480px;margin:0 auto;padding:32px 20px 48px}
.card{background:rgba(255,255,255,.5);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:20px;padding:40px 24px;box-shadow:0 10px 30px rgba(0,0,0,.08)}
.small{letter-spacing:.3em;text-transform:uppercase;font-size:12px;color:var(--soft)}
.om{font-size:28px;color:var(--gold);margin-bottom:8px}
h4{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:44px;line-height:1.15;margin:18px 0}
.name{background:linear-gradient(180deg,var(--card),var(--bg));border:1px solid var(--gold);border-radius:14px;color:var(--ink);font:inherit;cursor:pointer;padding:2px 22px 6px;margin:4px 0;position:relative;transform:translateY(0);box-shadow:0 1px 0 #d9a85a,0 2px 0 #c9953f,0 3px 0 #b8863b,0 4px 0 #a5772f,0 5px 0 #946a29,0 10px 16px rgba(0,0,0,.28);text-shadow:0 1px 0 var(--card),0 2px 3px rgba(0,0,0,.18);transition:transform .12s ease,box-shadow .12s ease;animation:bob 2.6s ease-in-out infinite}
.name[data-p=bride]{animation-delay:1.3s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.name:hover,.name:focus-visible{color:var(--gold);outline:none;transform:translateY(-3px);animation:none}
.name:active{animation:none;transform:translateY(4px);box-shadow:0 1px 0 #946a29,0 3px 6px rgba(0,0,0,.25)}
@media (prefers-reduced-motion:reduce){.name{animation:none}}
.amp{display:block;color:var(--gold);font-style:italic;font-size:30px;margin:10px 0}
.hint{font-size:12px;color:var(--soft);margin-top:-6px}
.divider{width:60px;height:1px;background:var(--gold);margin:28px auto}
.detail{font-family:'Cormorant Garamond',Georgia,serif;font-size:24px;margin:6px 0}
.note{color:var(--soft);font-size:15px;line-height:1.6}
.modal{position:fixed;inset:0;background:rgba(255,255,255,.35);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;padding:24px;z-index:20}
.modal.open{display:flex}
.pop{background:#fff;width:min(320px,100%);position:relative;padding:22px 16px 16px;border-radius:26px;text-align:center;box-shadow:0 30px 80px rgba(60,40,20,.35);animation:in .45s cubic-bezier(.2,1.2,.3,1)}
.pop .cap{padding:0 36px 14px}
.pop h2{font-family:'Cormorant Garamond',Georgia,serif;font-size:32px;font-weight:500;color:#2b2320;margin:0 0 2px;letter-spacing:.02em;line-height:1.1}
.pop .small{color:#a08a78;font-size:11px}
.pop img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;border-radius:20px;box-shadow:0 8px 20px rgba(60,40,20,.18)}
.x{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:50%;background:#f6f1ea;border:0;font-size:20px;line-height:1;color:#8a7060;cursor:pointer;z-index:2}
.map{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;margin-top:10px;border-radius:50%;background:#fff;border:1px solid var(--gold);color:var(--gold);box-shadow:0 3px 0 #b8863b,0 8px 14px rgba(0,0,0,.2);transition:transform .12s ease,box-shadow .12s ease;text-decoration:none}
.map svg{width:20px;height:20px;fill:currentColor}
.map:hover{transform:translateY(-2px)}
.map:active{transform:translateY(3px);box-shadow:0 0 0 #b8863b,0 3px 6px rgba(0,0,0,.2)}
.modal.open .pop img{animation:imgIn .8s cubic-bezier(.2,.8,.2,1) both}
.modal.open .pop h2{animation:nameIn .6s ease .8s both}
.modal.open .pop .small{animation:nameIn .6s ease 1s both}
@keyframes imgIn{from{opacity:0;transform:scale(1.2);filter:blur(12px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes nameIn{from{opacity:0;transform:translateY(-14px);letter-spacing:.2em}to{opacity:1;transform:none;letter-spacing:.02em}}
@media (prefers-reduced-motion:reduce){.modal.open .pop img,.modal.open .pop h2,.modal.open .pop .small{animation:none}}
.x{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:50%;background:#f6f1ea;border:0;font-size:22px;line-height:1;color:#8a7060;cursor:pointer}
.x:hover{background:#efe5d8}

/* INTRO: white page, then ॐ, then details */
.splash{position:fixed;inset:0;background:#fff;z-index:50;display:flex;align-items:center;justify-content:center;pointer-events:none;animation:splashOut 1s ease 3.2s forwards}
.splash span{font-family:'Noto Serif Devanagari',serif;font-size:110px;line-height:1;color:var(--gold);opacity:0;animation:omIn 2.2s ease .5s forwards}
@keyframes omIn{0%{opacity:0;transform:scale(.7);filter:blur(10px);text-shadow:0 0 0 rgba(184,134,59,0)}60%{opacity:1;transform:scale(1);filter:blur(0);text-shadow:0 0 30px rgba(184,134,59,.45)}100%{opacity:1;transform:scale(1.06);filter:blur(0);text-shadow:0 0 40px rgba(184,134,59,.3)}}
@keyframes splashOut{to{opacity:0;visibility:hidden}}
.card{animation:cardIn 1s ease 3.3s backwards}
@keyframes cardIn{from{opacity:0}to{opacity:1}}
.card>*{animation:rise .9s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.card>*:nth-child(1){animation-delay:3.34s}
.card>*:nth-child(2){animation-delay:3.48s}
.card>*:nth-child(3){animation-delay:3.62s}
.card>*:nth-child(4){animation-delay:3.76s}
.card>*:nth-child(5){animation-delay:3.90s}
.card>*:nth-child(6){animation-delay:4.04s}
.card>*:nth-child(7){animation-delay:4.18s}
.card>*:nth-child(8){animation-delay:4.32s}
.card>*:nth-child(9){animation-delay:4.46s}
.card>*:nth-child(10){animation-delay:4.60s}
.card>*:nth-child(11){animation-delay:4.74s}
.card>*:nth-child(12){animation-delay:4.88s}
.card>*:nth-child(13){animation-delay:5.02s}
.card>*:nth-child(14){animation-delay:5.16s}
.card>*:nth-child(15){animation-delay:5.30s}
.card>*:nth-child(16){animation-delay:5.44s}
@media (prefers-reduced-motion:reduce){.splash{display:none}.card,.card>*{animation:none}}
.snd{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:44px;height:44px;border-radius:50%;background:#fff;border:1px solid var(--gold);font-size:20px;line-height:1;cursor:pointer;z-index:30;box-shadow:0 3px 0 #b8863b,0 8px 14px rgba(0,0,0,.2);animation:rise .9s ease 4.5s backwards}
.snd:active{transform:translateY(3px);box-shadow:0 0 0 #b8863b,0 3px 6px rgba(0,0,0,.2)}
/* TAP TO OPEN: intro waits for the first tap, which also starts the music */
body:not(.go) .splash,body:not(.go) .splash span,body:not(.go) .card,body:not(.go) .card>*,body:not(.go) .snd{animation-play-state:paused}
.splash{pointer-events:auto;cursor:pointer;-webkit-tap-highlight-color:transparent}
body.go .splash{pointer-events:none}
.tap{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;font-family:Jost,system-ui,sans-serif;font-weight:300;font-size:13px;letter-spacing:.35em;text-transform:uppercase;color:var(--gold);animation:tapPulse 2s ease-in-out infinite}
body.go .tap{animation:none;opacity:0;transition:opacity .4s ease}
@keyframes tapPulse{0%,100%{opacity:.35}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.tap{display:none}}
/* SINGLE SCREEN: everything fits one phone screen, no scrolling */
html,body{height:100%;overflow:hidden}
.wrap{height:100dvh;max-width:480px;display:flex;align-items:center;justify-content:center;padding:calc(10px + env(safe-area-inset-top,0px)) 14px calc(10px + env(safe-area-inset-bottom,0px))}
.card{width:100%;max-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:clamp(12px,2.4vh,28px) 16px;background:rgba(255,255,255,.72)}
.small{font-size:clamp(8px,1.45vh,11px);letter-spacing:.18em;line-height:1.5}
h1{font-size:clamp(18px,3vh,28px);margin:clamp(6px,1.4vh,14px) 0}
.name{padding:2px 14px 5px;margin:2px 0}
.amp{font-size:clamp(16px,2.6vh,24px);margin:clamp(3px,.8vh,8px) 0}
.divider{margin:clamp(7px,1.7vh,18px) auto}
.detail{font-size:clamp(14px,2.5vh,21px);margin:2px 0}
.note{font-size:clamp(11px,1.7vh,14px);line-height:1.5;margin:2px 0}
.map{width:36px;height:36px;margin-top:6px}
.map svg{width:17px;height:17px}
.small{color:#6b5444}.note{color:#6b5444}
